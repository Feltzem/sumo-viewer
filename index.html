<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamilton SUMO Editor</title>
    <script>
      (() => {
        const key = "hamilton-sumo-theme";
        const stored = window.localStorage.getItem(key);
        const preference = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
        const resolved = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ? "dark"
          : "light";
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
    <script type="module" crossorigin src="/sumo-viewer/assets/index-uUHBR6sZ.js"></script>

  </head>

</html>
